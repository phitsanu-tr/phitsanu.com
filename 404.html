<body>

<script>
(function () {
  var svg = document.getElementById('city');
  var FAR = '#1d2158', FAR2 = '#232868', DARK = '#0a0c28', DARK2 = '#0d1030', MIDT = '#12153a';
  function rnd(seed) { var s = seed; return function () { s = (s * 16807) % 2147483647; return s / 2147483647; }; }
  function f(n) { return n.toFixed(1); }

  function layer(seed, fills, wins, minH, varH, litP, near, vw, hh, k) {
    var r = rnd(seed), x = -6 * k, o = '';
    while (x < vw + 6 * k) {
      var w = (12 + r() * 20) * k, h = (minH + r() * varH) * k, top = hh - h, fill = fills[Math.floor(r() * fills.length)];
      o += '<rect x="' + f(x) + '" y="' + f(top) + '" width="' + f(w) + '" height="' + f(h) + '" fill="' + fill + '"/>';
      if (r() < 0.25) {
        var ax = x + w / 2;
        o += '<rect x="' + f(ax - 0.5 * k) + '" y="' + f(top - 9 * k) + '" width="' + f(k) + '" height="' + f(9 * k) + '" fill="' + fill + '"/>';
        if (near) o += '<circle class="bc" style="animation-delay:-' + (r() * 1.4).toFixed(1) + 's" cx="' + f(ax) + '" cy="' + f(top - 9 * k) + '" r="' + f(0.9 * k) + '" fill="#ff5a5a"/>';
      }
      var px = (5 + r() * 2.2) * k, py = (7 + r() * 2.6) * k, ww = (2.4 + r() * 1.2) * k, wh = (3.4 + r() * 1.2) * k;
      for (var wx = x + 3.5 * k; wx < x + w - 3 * k; wx += px) for (var wy = top + 6 * k; wy < hh - 6 * k; wy += py) {
        if (r() < litP) {
          var blink = near && r() < 0.1;
          o += '<rect' + (blink ? ' class="wb" style="animation-delay:-' + (r() * 5).toFixed(1) + 's"' : '') + ' x="' + f(wx) + '" y="' + f(wy) + '" width="' + f(ww) + '" height="' + f(wh) + '" rx="' + f(0.5 * k) + '" fill="' + wins[Math.floor(r() * wins.length)] + '"/>';
        }
      }
      x += w + (r() < 0.3 ? 2 * k : 0);
    }
    return o;
  }

  function tower(cx, x0, k, hh, inner) {
    return '<g transform="translate(' + f(cx) + ' ' + f(hh) + ') scale(' + f(k) + ') translate(' + (-x0) + ' -120)">' + inner + '</g>';
  }

  function build() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var hh = Math.round(Math.min(vh * 0.32, 264)), wh = Math.round(hh * 0.13), total = hh + wh, k = hh / 120;
    svg.setAttribute('viewBox', '0 0 ' + vw + ' ' + total);
    svg.setAttribute('width', vw); svg.setAttribute('height', total);

    var spire = '<g fill="' + MIDT + '"><polygon points="196,120 196,44 200,44 200,30 204,30 204,18 206,18 206,4 207,4 207,18 209,18 209,30 213,30 213,44 217,44 217,120"/></g>' +
      '<g fill="#ffd27a"><rect x="201" y="50" width="2" height="3"/><rect x="205" y="58" width="2" height="3"/><rect x="202" y="70" width="2" height="3"/><rect x="209" y="80" width="2" height="3"/><rect x="208" y="96" width="2" height="3"/></g>' +
      '<circle class="bc" cx="206.5" cy="3" r="1.3" fill="#ff5a5a"/>';
    var slant = '<polygon points="110,120 110,54 130,36 130,120" fill="' + MIDT + '"/>' +
      '<g fill="#6fe0ff"><rect x="114" y="66" width="2" height="3"/><rect x="120" y="78" width="2" height="3"/><rect x="115" y="92" width="2" height="3"/></g>';
    var step = '<g fill="' + MIDT + '"><rect x="240" y="48" width="26" height="72"/><rect x="246" y="40" width="14" height="8"/><rect x="252" y="28" width="2" height="12"/></g>' +
      '<g fill="#ffd27a"><rect x="246" y="60" width="3" height="4"/><rect x="254" y="74" width="3" height="4"/><rect x="246" y="88" width="3" height="4"/><rect x="256" y="102" width="3" height="4"/></g>' +
      '<circle class="bc" cx="253" cy="27" r="1.2" fill="#ff5a5a" style="animation-delay:-.7s"/>';

    var defs = '<defs>' +
      '<linearGradient id="hz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ee7d8e" stop-opacity="0"/><stop offset="1" stop-color="#ee7d8e" stop-opacity=".5"/></linearGradient>' +
      '<linearGradient id="hz2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c778b0" stop-opacity="0"/><stop offset="1" stop-color="#c778b0" stop-opacity=".22"/></linearGradient>' +
      '<linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8679c"/><stop offset=".22" stop-color="#6a3a8e"/><stop offset=".62" stop-color="#1e1c56"/><stop offset="1" stop-color="#0a0c28"/></linearGradient>' +
      '<linearGradient id="fd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>' +
      '<mask id="wm" maskUnits="userSpaceOnUse" x="0" y="' + hh + '" width="' + vw + '" height="' + wh + '"><rect x="0" y="' + hh + '" width="' + vw + '" height="' + wh + '" fill="url(#fd)"/></mask>' +
      '<filter id="rip" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.22" numOctaves="1" seed="3" result="n"/>' +
      '<feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="0.8 1.4"/></filter>' +
      '</defs>';
    var haze1 = '<rect x="0" y="' + f(hh * 0.42) + '" width="' + vw + '" height="' + f(hh * 0.58) + '" fill="url(#hz)"/>';
    var haze2 = '<rect x="0" y="' + f(hh * 0.66) + '" width="' + vw + '" height="' + f(hh * 0.34) + '" fill="url(#hz2)"/>';

    var sk = layer(21, [FAR, FAR2], ['#3b4390'], 26, 34, 0.28, false, vw, hh, k) +
      haze1 +
      tower(vw * 0.30, 120, k, hh, slant) +
      tower(vw * 0.74, 206.5, k, hh, spire) +
      tower(vw * 0.90, 253, k, hh, step) +
      haze2 +
      layer(33, [DARK, DARK2], ['#ffd27a', '#6fe0ff'], 12, 24, 0.35, true, vw, hh, k);

    // water: mirrored skyline that fades with depth, a waterline glint and slow shimmer
    var r = rnd(77), rip = '';

    }

      '<g id="sk">' + sk + '</g>' +
      '<rect x="0" y="' + hh + '" width="' + vw + '" height="' + wh + '" fill="url(#wg)"/>' +
      '<g mask="url(#wm)"><g transform="translate(0 ' + (2 * hh) + ') scale(1 -1)" filter="url(#rip)" opacity=".5">' + sk.replace(/ class="(wb|bc)"/g, '') + '</g></g>' +
      rip +
      '<rect x="0" y="' + hh + '" width="' + vw + '" height="1" fill="#ffb6d3" opacity=".45"/>';
  }
  var rt, lastW = window.innerWidth;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth; clearTimeout(rt); rt = setTimeout(build, 120);
  });

})();

<script>
(function () {
  var box = document.getElementById('stars'), title = document.querySelector('[data-clear]'), moon = document.querySelector('.moon');
  function build() {
    box.innerHTML = '';
    var vw = window.innerWidth, vh = window.innerHeight, skyH = vh * 0.62;
    var target = vw < 600 ? 55 : 110;
    var cell = Math.max(30, Math.sqrt(vw * skyH / target));
    var tr = title.getBoundingClientRect(), mr = moon.getBoundingClientRect();
    var ex = { l: tr.left - 44, r: tr.right + 44, t: tr.top - 36, b: tr.bottom + 36 };
    var mx = mr.left + mr.width / 2, my = mr.top + mr.height / 2, mrad = mr.width / 2 + 36;
    var frag = document.createDocumentFragment();
    for (var cy = 0; cy < skyH; cy += cell) for (var cx = 0; cx < vw; cx += cell) {
      if (Math.random() < 0.08) continue;
      var x = cx + cell * (0.15 + Math.random() * 0.7), y = cy + cell * (0.15 + Math.random() * 0.7);
      if (y > skyH || x > vw) continue;
      if (x > ex.l && x < ex.r && y > ex.t && y < ex.b) continue;
      var dx = x - mx, dy = y - my;
      if (dx * dx + dy * dy < mrad * mrad) continue;
      var st = document.createElement('i'), size = 2.5 + Math.random() * 2;
      st.className = Math.random() < 0.3 ? 'star blink' : 'star';
      st.style.cssText = 'left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px;width:' + size.toFixed(1) + 'px;height:' + size.toFixed(1) +
        'px;--o:' + (0.75 + Math.random() * 0.25).toFixed(2) + ';--d:' + (3 + Math.random() * 4).toFixed(1) + 's;--dl:-' + (Math.random() * 6).toFixed(1) + 's';
      frag.appendChild(st);
    }
    box.appendChild(frag);
  }
  var done = false, rt, lastW = window.innerWidth;
  function first() { if (done) return; done = true; build(); box.classList.add('on'); }
  if (document.fonts && document.fonts.load) document.fonts.load('600 40px Quicksand').then(first, first);
  setTimeout(first, 1200);
  window.addEventListener('resize', function () {
    if (!done || window.innerWidth === lastW) return;
    lastW = window.innerWidth; clearTimeout(rt); rt = setTimeout(build, 150);
  });
})();
</script>
<script>
(function () {

  var ANG = 28, DIST = 300;
  function shoot() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var el = document.createElement('div');
    el.className = 'shoot';
    document.body.appendChild(el);
    var x0 = vw * (0.08 + Math.random() * 0.6), y0 = vh * (0.03 + Math.random() * 0.15);
    var dx = Math.cos(ANG * Math.PI / 180) * DIST, dy = Math.sin(ANG * Math.PI / 180) * DIST;
    var a = el.animate([
      { transform: 'translate(' + x0 + 'px,' + y0 + 'px) rotate(' + ANG + 'deg)', opacity: 0 },
      { opacity: 1, offset: 0.15 },
      { transform: 'translate(' + (x0 + dx) + 'px,' + (y0 + dy) + 'px) rotate(' + ANG + 'deg)', opacity: 0 }
    ], { duration: 1000, easing: 'ease-in' });
    a.onfinish = function () { el.remove(); };
    setTimeout(shoot, 5000 + Math.random() * 6000);
  }
  setTimeout(shoot, 2500);
})();
</script>
